name: FX-Lab Agency — Weekly Effects

on:
  schedule:
    # Monday 22:00 UTC — new effects
    - cron: '0 22 * * 1'
    # Wednesday 22:00 UTC — knowledge acquisition
    - cron: '0 22 * * 3'
  workflow_dispatch:
    inputs:
      mode:
        description: 'effects or knowledge'
        required: false
        default: 'effects'

jobs:
  agency-weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.name "FX-Lab Agency"
          git config user.email "agency@fx-lab.bot"

      - name: Determine task (effects vs knowledge)
        id: task
        run: |
          # Monday = effects, Wednesday = knowledge
          DOW=$(date +%u)
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "knowledge" ] || [ "$DOW" = "3" ]; then
            echo "prompt=You are the FX-Lab Knowledge Acquirer agent. Repo is at $(pwd). Read .claude/MEMORY.md and .claude/standards.md. Search the web for new CSS/WebGL/canvas animation techniques published in the last week. Check CSS-Tricks, web.dev, Codrops, and Shadertoy for notable techniques. Write distilled findings to .claude/knowledge/$(date +%Y-%m-%d)-techniques.md. If any technique is significant enough to become a standard, also update .claude/standards.md. Add any promising effect ideas to .claude/effects-catalog.md. Commit all changes with format: '[agency] knowledge: topic summary'." >> $GITHUB_OUTPUT
          else
            echo "prompt=You are the FX-Lab Effect Researcher agent. Repo is at $(pwd). Read CLAUDE.md, .claude/MEMORY.md, .claude/standards.md, and .claude/effects-catalog.md. Pick 1-2 high-priority candidate effects from the catalog. Implement them as complete effect files in js/effects/ following the standards exactly. Add each file's script tag to index.html. Update .claude/effects-catalog.md to mark them as done. Update .claude/MEMORY.md with the new effect count. Commit each effect separately with format: '[agency] feat: add effect-name'. Push all changes." >> $GITHUB_OUTPUT
          fi

      - name: Run weekly task
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_NO_UPDATE_NOTIFICATION: 1
        run: claude -p "${{ steps.task.outputs.prompt }}" --dangerouslySkipPermissions

      - name: Push any changes
        run: git push origin HEAD
