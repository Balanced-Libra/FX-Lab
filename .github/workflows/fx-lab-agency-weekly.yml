name: FX-Lab Agency — Weekly Effects & Knowledge

on:
  schedule:
    # Monday 22:00 UTC — new effects
    - cron: '0 22 * * 1'
    # Wednesday 22:00 UTC — knowledge acquisition
    - cron: '0 22 * * 3'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Task mode: effects or knowledge'
        required: false
        default: 'effects'

jobs:
  agency-weekly:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install opencode (anomalyco fork)
        run: bun install -g opencode-ai@latest

      - name: Configure git identity
        run: |
          git config user.name "FX-Lab Agency"
          git config user.email "agency@fx-lab.bot"

      - name: Write opencode config (Gemini Flash)
        run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json << 'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "google/gemini-2.0-flash",
            "autoshare": false
          }
          EOF

      - name: Determine task
        id: task
        run: |
          DOW=$(date +%u)   # 1=Mon, 3=Wed
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "knowledge" ] || [ "$DOW" = "3" ]; then
            echo "mode=knowledge" >> $GITHUB_OUTPUT
            cat >> $GITHUB_OUTPUT << 'PROMPT'
          prompt=You are the FX-Lab Knowledge Acquirer agent. The repo is at $(pwd). Read .claude/MEMORY.md and .claude/standards.md. Search the web for new CSS, WebGL, and canvas animation techniques from the past week. Check CSS-Tricks, web.dev, Codrops, and Shadertoy. Write distilled findings to .claude/knowledge/$(date +%Y-%m-%d)-techniques.md. If any technique warrants a new standard, update .claude/standards.md. Add promising new effect ideas to .claude/effects-catalog.md. Commit all changes: '[agency] knowledge: summary'
          PROMPT
          else
            echo "mode=effects" >> $GITHUB_OUTPUT
            cat >> $GITHUB_OUTPUT << 'PROMPT'
          prompt=You are the FX-Lab Effect Researcher agent. The repo is at $(pwd). Read CLAUDE.md, .claude/MEMORY.md, .claude/standards.md, and .claude/effects-catalog.md. Pick 1-2 high-priority candidate effects from the catalog. Implement them as complete effect files in js/effects/ following standards exactly — correct id, name, type, tags (including vibe tags), perf, description (plain English, no jargon), init, teardown, and registration call. Add each file's script tag to index.html in alphabetical order. Mark them done in .claude/effects-catalog.md. Update effect count in .claude/MEMORY.md. Commit each effect separately: '[agency] feat: add effect-name'. Push all changes: git push origin HEAD
          PROMPT
          fi

      - name: Run weekly task
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
        run: opencode -p "${{ steps.task.outputs.prompt }}" -q

      - name: Push any remaining changes
        run: git diff --quiet HEAD || git push origin HEAD
