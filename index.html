  <meta name="author" content="Your Name" />
  <meta name="robots" content="index, follow" />

  <meta name="theme-color" content="#0b0c0f" />

       ============================================= -->

<body>
  <!-- =============================================
       HEADER / TOPBAR
       ============================================= -->
  <header class="topbar">
    <h1>FX-Lab</h1>
    <div class="glass-reflection"></div>
    <div class="controls">
      <label for="search" class="visually-hidden">Search effects and tags</label>
      <input id="search" type="search" placeholder="Try 'calming', 'glowing', 'buttons'…" aria-label="Search effects" />
      <button id="themeToggle" class="btn ghost" aria-label="Toggle theme" title="Press T to toggle theme" type="button">🌓</button>
    </div>
    <div id="tags" class="tagbar" aria-label="Tags"></div>
  </header>

  <!-- =============================================
       MAIN CONTENT
       ============================================= -->
  <main>
    <!-- JavaScript warning for debugging -->
    <div id="js-warning" style="max-width:1200px;margin:16px auto;padding:12px 16px;border:1px solid #8b0000;color:#ffbdbd;background:#250000;border-radius:8px">
      If you see this, JavaScript didn't load. Try saving and reloading the page.
    </div>
    
    <!-- Welcome banner -->
    <div id="welcomeBanner" class="welcome-banner" style="display:none">
      <div class="welcome-content">
        <h2>🎨 Welcome to FX-Lab</h2>
        <p>Explore 72 interactive effects. Hover a card to preview it. Use <kbd>/</kbd> to search, click tags to filter by vibe or category.</p>
        <button class="btn" onclick="closeWelcome()">Get Started</button>
      </div>
    </div>
    
    <!-- Grid container for effect cards -->
    <section class="grid" id="grid" aria-live="polite"></section>
  </main>
  
  <script>
    // Show welcome banner on first visit
    if (!localStorage.getItem('fx-lab-visited')) {
      document.getElementById('welcomeBanner').style.display = 'block';
    }
    window.closeWelcome = () => {
      document.getElementById('welcomeBanner').style.display = 'none';
      localStorage.setItem('fx-lab-visited', 'true');
    };
  </script>

  <!-- =============================================
       MODAL DIALOG
       ============================================= -->
  <dialog id="demoModal">
    <div class="modal-head">
      <h2 id="demoTitle">Demo</h2>
      <div style="display:flex;gap:8px">
        <button id="codeBtn" class="btn ghost" aria-label="View Code">📄 Code</button>
        <button id="closeModal" class="btn ghost" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <div id="sandbox" class="sandbox" aria-label="Demo sandbox"></div>
      <aside id="explain" class="explain" aria-label="Explanation"></aside>
    </div>
    <div id="codePanel" class="code-panel" style="display:none">
      <div class="code-header">
        <span>Source Code</span>
        <button class="copy-code btn ghost">📋 Copy</button>
      </div>
      <pre class="code-content"></pre>
    </div>
    <div class="meta">
      <span id="metaType"></span> •
      <span id="metaLoad"></span> •
      <span id="metaTags"></span>
    </div>
  </dialog>
